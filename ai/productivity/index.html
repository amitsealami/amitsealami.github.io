<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productivity Tracker</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#5b8cff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
// Apply the saved theme before the first paint so the page does not flash.
try {
  var p = JSON.parse(localStorage.getItem('prefs') || '{}');
  var sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = (p.theme === 'light' || p.theme === 'dark') ? p.theme : sys;
  document.documentElement.dataset.accent = p.accent || 'blue';
} catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- icon sprite: stroke icons referenced with <use href="#i-..."> -->
<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="toprow">
      <button class="icon-btn" id="backBtn" hidden title="Back"><svg class="ico"><use href="#i-back"/></svg></button>
      <h1 id="title">Projects</h1>
      <span class="badge" id="modeBadge" title="Where your data is stored"></span>
      <div class="spacer"></div>
      <button class="icon-btn" id="tickBtn" title="Ticking sound on/off" aria-pressed="false"><svg class="ico"><use href="#i-timer"/></svg></button>
      <button class="icon-btn" id="menuBtn" title="Menu"><svg class="ico"><use href="#i-sliders"/></svg></button>
    </div>
    <nav class="tabs" aria-label="Views">
      <button data-view="projects" class="active"><svg class="ico"><use href="#i-folder"/></svg>Projects</button>
      <button data-view="reports"><svg class="ico"><use href="#i-chart"/></svg>Reports</button>
      <button data-view="timeline"><svg class="ico"><use href="#i-list"/></svg>Timeline</button>
      <button data-view="calendar"><svg class="ico"><use href="#i-calendar"/></svg>Calendar</button>
    </nav>
  </header>

  <main id="view"></main>

  <div id="runbar" class="runbar" hidden>
    <span class="dot" id="runDot"></span>
    <div class="runinfo">
      <div class="runproject" id="runProject"></div>
      <div class="runtask" id="runTask"></div>
    </div>
    <div class="runtime" id="runTime">0:00</div>
    <button class="stop-btn" id="stopBtn" title="Stop"><svg class="ico"><use href="#i-stop"/></svg></button>
  </div>

</div>

<dialog id="dlg"></dialog>
<input type="file" id="importFile" accept="application/json" hidden>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
